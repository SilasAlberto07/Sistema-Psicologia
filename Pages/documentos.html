<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="../assets/css/documentos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container">
            <div class="documentos-container">

                <h1 class="page-title"><i class="ti ti-file-text" style="color:#8a9e78"></i> Documentos</h1>

                <div class="form-section">

                    <div class="busca-documento">
                        <i class="ti ti-search"></i>
                        <input type="text" id="buscaPacienteDoc" placeholder="Buscar paciente ou casal pelo nome...">
                    </div>

                    <div class="linha">
                        <div class="form-group w-100">
                            <label>Paciente</label>
                            <select id="selectPaciente">
                                <option value="">Selecione um paciente...</option>
                            </select>
                        </div>
                        <div class="form-group w-50">
                            <label>Tipo de documento</label>
                            <select id="tipoDocumento">
                                <option value="declaracao">Declaração de Comparecimento</option>
                                <option value="atestado">Atestado Psicológico</option>
                            </select>
                        </div>
                    </div>

                    <!-- CAMPOS DECLARAÇÃO -->
                    <div id="camposDeclaracao" class="grupo-campos">
                        <div class="linha">
                            <div class="form-group w-30">
                                <label>Data da sessão</label>
                                <input type="date" id="declData">
                            </div>
                            <div class="form-group w-20">
                                <label>Horário</label>
                                <input type="time" id="declHora">
                            </div>
                            <div class="form-group w-100">
                                <label>Endereço do atendimento</label>
                                <input type="text" id="declEndereco" placeholder="Rua, número, bairro">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Previsão de retorno / observação</label>
                                <input type="text" id="declPrevisao"
                                    placeholder="Ex: sem data prevista para o término do acompanhamento">
                            </div>
                        </div>
                    </div>

                    <!-- CAMPOS ATESTADO -->
                    <div id="camposAtestado" class="grupo-campos" style="display:none">
                        <div class="linha">
                            <div class="form-group w-30">
                                <label>Data de início do acompanhamento</label>
                                <input type="date" id="atestData">
                            </div>
                            <div class="form-group w-40">
                                <label>Duração do afastamento</label>
                                <input type="text" id="atestDuracao" placeholder="Ex: tempo indeterminado / 7 dias">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Motivo / quadro apresentado</label>
                                <input type="text" id="atestMotivo"
                                    placeholder="Ex: quadro de ansiedade e esgotamento emocional">
                            </div>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="form-group w-50">
                            <label>Cidade / Estado</label>
                            <input type="text" id="cidadeEstado" placeholder="Sinop, MT">
                        </div>
                    </div>

                    <div class="botoes">
                        <button id="btnGerar" class="btn-salvar"><i class="ti ti-file-check"></i> Gerar e
                            Imprimir</button>
                    </div>

                </div>

            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/alert.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/documentos.js"></script>
</body>

</html>
