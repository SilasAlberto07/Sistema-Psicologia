<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/novocadastro.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>
<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container page-container-cadastro">

                    </div>

                    <div class="cadastro-card-divisor"></div>
                    <p>Cadastro de um paciente para atendimento individual.</p>
                    <a href="novopaciente.html" class="btn-cadastro">
                        Iniciar Cadastro <i class="ti ti-arrow-right"></i>
                    </a>
                </div>

                <div class="cadastro-card">
                    <div class="cadastro-card-icone">
                        <i class="ti ti-users-group"></i>
                    </div>

                    <div class="cadastro-card-divisor"></div>
                    <p>Cadastro de um casal para terapia de casal.</p>
                    <a href="novocasal.html" class="btn-cadastro">
                        Iniciar Cadastro <i class="ti ti-arrow-right"></i>
                    </a>
                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
