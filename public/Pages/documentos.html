<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="../assets/css/documentos.css">
    <link rel="stylesheet" href="../assets/css/contrato.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container">
            <div class="documentos-container">

                <h1 class="page-title"><i class="ti ti-file-text" style="color:#8a9e78"></i> Documentos</h1>

                <div class="form-section">

                    <div class="linha">
                        <div class="form-group w-100">
                            <label>Paciente</label>
                            <input type="text" id="inputPaciente" list="listaPacientes" autocomplete="off"
                                placeholder="Digite o nome do paciente ou casal...">
                            <datalist id="listaPacientes"></datalist>
                        </div>
                        <div class="form-group w-50">
                            <label>Tipo de documento</label>
                            <select id="tipoDocumento">
                                <option value="declaracao">Declaração de Comparecimento</option>
                                <option value="atestado">Atestado Psicológico</option>
                                <option value="contrato">Contrato de Prestação de Serviços de Psicoterapia</option>
                            </select>
                        </div>
                    </div>

                    <!-- CAMPOS DECLARAÇÃO -->
                    <div id="camposDeclaracao" class="grupo-campos">
                        <div class="linha">
                            <div class="form-group w-30">
                                <label>Data da sessão</label>
                                <input type="date" id="declData">
                            </div>
                            <div class="form-group w-20">
                                <label>Horário</label>
                                <input type="time" id="declHora">
                            </div>
                            <div class="form-group w-100">
                                <label>Endereço do atendimento</label>
                                <input type="text" id="declEndereco" placeholder="Rua, número, bairro">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Previsão de retorno / observação</label>
                                <input type="text" id="declPrevisao"
                                    placeholder="Ex: sem data prevista para o término do acompanhamento">
                            </div>
                        </div>
                    </div>

                    <!-- CAMPOS ATESTADO -->
                    <div id="camposAtestado" class="grupo-campos" style="display:none">
                        <div class="linha">
                            <div class="form-group w-30">
                                <label>Data de início do acompanhamento</label>
                                <input type="date" id="atestData">
                            </div>
                            <div class="form-group w-40">
                                <label>Duração do afastamento</label>
                                <input type="text" id="atestDuracao" placeholder="Ex: tempo indeterminado / 7 dias">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Motivo / quadro apresentado</label>
                                <input type="text" id="atestMotivo"
                                    placeholder="Ex: quadro de ansiedade e esgotamento emocional">
                            </div>
                        </div>
                    </div>

                    <!-- CAMPOS CONTRATO -->
                    <div id="camposContrato" class="grupo-campos" style="display:none">

                        <p class="contrato-aviso">Campos com <span class="obrigatorio">*</span> são obrigatórios. Só as assinaturas ficam para preencher à mão.</p>

                        <h4 class="contrato-subtitulo">Dados da psicóloga <small>(ficam guardados para os próximos contratos)</small></h4>
                        <div class="linha">
                            <div class="form-group w-50">
                                <label>Nome <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPsiNome">
                            </div>
                            <div class="form-group w-20">
                                <label>CRP <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPsiCrp" placeholder="18/0000">
                            </div>
                            <div class="form-group w-30">
                                <label>CPF <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPsiCpf" placeholder="000.000.000-00">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Endereço do atendimento <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPsiEndereco" placeholder="Rua, número, bairro, cidade-UF, CEP">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-50">
                                <label>E-mail</label>
                                <input type="text" id="ctPsiEmail">
                            </div>
                            <div class="form-group w-50">
                                <label>Telefone</label>
                                <input type="text" id="ctPsiTelefone">
                            </div>
                        </div>

                        <h4 class="contrato-subtitulo">Dados do(a) paciente <small>(vêm do cadastro ao escolher o paciente acima — confira)</small></h4>
                        <div class="linha">
                            <div class="form-group w-50">
                                <label>Nome completo <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPacNome">
                            </div>
                            <div class="form-group w-30">
                                <label>CPF <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPacCpf" placeholder="000.000.000-00">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Endereço <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPacEndereco" placeholder="Rua, número, bairro, cidade-UF">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-50">
                                <label>E-mail</label>
                                <input type="text" id="ctPacEmail">
                            </div>
                            <div class="form-group w-50">
                                <label>Telefone</label>
                                <input type="text" id="ctPacTelefone">
                            </div>
                        </div>

                        <h4 class="contrato-subtitulo">Serviços, valores e sessões</h4>
                        <div class="linha">
                            <div class="form-group w-100">
                                <label>Serviços oferecidos (um por linha) <span class="obrigatorio">*</span></label>
                                <textarea id="ctServicos" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-20">
                                <label>Valor da sessão (R$) <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctValor" placeholder="180,00">
                            </div>
                            <div class="form-group w-50">
                                <label>Formas de pagamento <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctFormasPagamento">
                            </div>
                            <div class="form-group w-30">
                                <label>Prazo do pagamento <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPrazoPagamento">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-20">
                                <label>Duração da sessão (min) <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctDuracao" placeholder="45">
                            </div>
                            <div class="form-group w-30">
                                <label>Periodicidade <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctPeriodicidade" placeholder="semanal / de 15 em 15 dias">
                            </div>
                            <div class="form-group w-20">
                                <label>Multa por gravação (R$) <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctMulta" placeholder="500,00">
                            </div>
                            <div class="form-group w-30">
                                <label>Foro (comarca) <span class="obrigatorio">*</span></label>
                                <input type="text" id="ctForo" placeholder="Sinop-MT">
                            </div>
                        </div>
                        <div class="linha">
                            <div class="form-group w-30">
                                <label>Data do contrato <span class="obrigatorio">*</span></label>
                                <input type="date" id="ctData">
                            </div>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="form-group w-50">
                            <label>Cidade / Estado</label>
                            <input type="text" id="cidadeEstado" placeholder="Sinop, MT">
                        </div>
                    </div>

                    <div class="botoes">
                        <button id="btnGerar" class="btn-salvar"><i class="ti ti-file-check"></i> Gerar e
                            Imprimir</button>
                    </div>

                </div>

            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/alert.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/documentos.js"></script>
</body>

</html>
