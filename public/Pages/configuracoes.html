<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="../assets/css/configuracoes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container">
            <div class="config-conteudo">

                <h1><i class="ti ti-settings" style="color:#8a9e78"></i> Configurações</h1>
                <p class="config-subtitulo">Preferências e manutenção do sistema.</p>

                <!-- ATUALIZAÇÕES -->
                <section class="config-card">
                    <div class="config-card-icone">
                        <i class="ti ti-refresh"></i>
                    </div>

                    <div class="config-card-corpo">
                        <h2>Atualizações</h2>
                        <p id="texto-atualizacao">
                            O sistema procura novas versões sozinho sempre que é aberto.
                            Se quiser, você também pode verificar agora.
                        </p>

                        <div class="config-versao">
                            Versão instalada: <strong id="versao-app">—</strong>
                        </div>

                        <div class="botoes" id="botoes-atualizacao">
                            <button class="btn-salvar" id="btnVerificarAtualizacao">
                                <i class="ti ti-refresh"></i> Verificar atualizações
                            </button>
                        </div>
                    </div>
                </section>

                <!-- SENHA -->
                <section class="config-card">
                    <div class="config-card-icone">
                        <i class="ti ti-key"></i>
                    </div>

                    <div class="config-card-corpo">
                        <h2>Senha de acesso</h2>
                        <p>Confirme sua senha atual e defina a nova.</p>

                        <div class="config-form">
                            <div class="form-group">
                                <label for="senhaAtual">Senha atual</label>
                                <input type="password" id="senhaAtual" autocomplete="current-password">
                            </div>

                            <div class="form-group">
                                <label for="senhaNovaTroca">Nova senha</label>
                                <input type="password" id="senhaNovaTroca" autocomplete="new-password">
                            </div>

                            <div class="form-group">
                                <label for="confirmarNovaTroca">Confirmar nova senha</label>
                                <input type="password" id="confirmarNovaTroca" autocomplete="new-password">
                            </div>

                            <div id="mensagem-erro-troca" class="config-erro"></div>
                        </div>

                        <div class="botoes">
                            <button class="btn-salvar" id="btnSalvarSenha">
                                <i class="ti ti-device-floppy"></i> Salvar nova senha
                            </button>
                        </div>
                    </div>
                </section>

            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/alert.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/configuracoes.js"></script>
</body>

</html>
