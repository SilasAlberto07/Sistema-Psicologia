<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/pacientes.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <title>Pacientes</title>
</head>

<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container">
            <div class="page-card">
                <h1 class="page-title"><i class="ti ti-users" style="color:#8a9e78"></i> Pacientes</h1>

                <div class="tabs-tipo">
                    <button class="tab-tipo ativa" data-tipo="individual">
                        <i class="ti ti-user"></i> Individual
                    </button>
                    <button class="tab-tipo" data-tipo="casal">
                        <i class="ti ti-users-group"></i> Casal
                    </button>
                </div>

                <input type="text" class="search-box" placeholder="🔍  Buscar por nome ou ID...">
                <div class="tabela-wrapper">
                    <table class="tabela">
                        <thead>
                            <tr>
                                <th class="th-sortavel" data-sort="id">ID <i class="ti ti-arrows-sort icone-ordem"></i></th>
                                <th class="th-sortavel" data-sort="nomeCompleto">Nome <i class="ti ti-arrows-sort icone-ordem"></i></th>
                                <th>Telefone</th>
                                <th class="th-sortavel" data-sort="dataCadastro">Data de Cadastro <i class="ti ti-arrows-sort icone-ordem"></i></th>
                                <th>Sessões</th>
                                <th>Tipo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-pacientes"></tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/alert.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/pacientes.js"></script>
</body>

</html>
