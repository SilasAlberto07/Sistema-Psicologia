<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altas</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/pacientes.css">
    <link rel="stylesheet" href="../assets/css/button.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="container-menu">

        <div id="menu"></div>

        <main class="page-container">
            <div class="page-card">
                <div class="titulo-com-acao">
                    <h1 class="page-title"><i class="ti ti-user-check" style="color:#8a9e78"></i> Pacientes com Alta</h1>
                    <a href="pacientes.html" class="link-altas"><i class="ti ti-arrow-left"></i> Voltar para Pacientes</a>
                </div>
                <p style="color:#9a9a88; margin-bottom:16px;">
                    Pacientes que receberam alta ficam aqui. Abra o relatório do tratamento para ler ou imprimir
                    (na impressão, escolha "Salvar como PDF" / "Microsoft Print to PDF" para gerar o arquivo).
                </p>

                <div class="tabs-tipo">
                    <button class="tab-tipo ativa" data-tipo="individual">
                        <i class="ti ti-user"></i> Individual
                    </button>
                    <button class="tab-tipo" data-tipo="casal">
                        <i class="ti ti-users-group"></i> Casal
                    </button>
                </div>

                <input type="text" class="search-box" id="buscaAltas" placeholder="🔍  Buscar por nome ou ID...">

                <div class="tabela-wrapper">
                    <table class="tabela">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Início</th>
                                <th>Data da alta</th>
                                <th>Sessões realizadas</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-altas"></tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/alert.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/altas.js"></script>
</body>

</html>
