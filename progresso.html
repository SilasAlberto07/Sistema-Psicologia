<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Baixando atualização</title>
<style>
    body {
        font-family: Segoe UI, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f5f5f7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100vh;
        box-sizing: border-box;
    }
    h2 {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: #222;
    }
    .barra-fundo {
        width: 100%;
        height: 18px;
        background: #ddd;
        border-radius: 9px;
        overflow: hidden;
    }
    .barra-preenchida {
        height: 100%;
        width: 0%;
        background: #2d7ff9;
        transition: width 0.2s ease;
    }
    .porcentagem {
        margin-top: 10px;
        font-size: 13px;
        color: #555;
        text-align: right;
    }
</style>
</head>
<body>
    <h2>Baixando atualização, aguarde...</h2>
    <div class="barra-fundo">
        <div class="barra-preenchida" id="barra"></div>
    </div>
    <div class="porcentagem" id="texto">0%</div>

    <script>
        window.updateAPI.onProgresso((percent) => {
            document.getElementById('barra').style.width = percent + '%';
            document.getElementById('texto').innerText = percent + '%';
        });
    </script>
</body>
</html>
